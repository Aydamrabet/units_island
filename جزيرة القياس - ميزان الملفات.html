<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزيرة القياس - ميزان وحدات التخزين</title>
    <!-- مكتبات CSS و JS الأساسية -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            margin: 0;
            padding: 20px;
            /* جعل الـ Body مرناً ليسمح بالتمرير إذا كانت الشاشة صغيرة ولا يقص المحتوى */
            min-height: 100vh;
            display: flex;
            box-sizing: border-box;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            /* استخدام margin auto يضمن تمركز اللعبة، وإذا صغرت الشاشة يسمح بالتمرير بدون قص من الأعلى */
            margin: auto; 
            min-height: 800px;
            height: auto;
            background: linear-gradient(to bottom, #38bdf8 0%, #818cf8 100%);
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 0 8px rgba(255,255,255,0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .scenery {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        
        .sun {
            position: absolute;
            top: 5%;
            right: 10%;
            width: 80px;
            height: 80px;
            background: #fde047;
            border-radius: 50%;
            box-shadow: 0 0 50px #fef08a, 0 0 100px #fde047;
        }

        .clouds {
            position: absolute;
            top: 10%;
            width: 100%;
            display: flex;
            justify-content: space-around;
            opacity: 0.9;
        }

        .cloud {
            background: white;
            border-radius: 50px;
            width: 140px;
            height: 45px;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
        }
        .cloud::before { width: 70px; height: 70px; top: -35px; left: 20px; }
        .cloud::after { width: 50px; height: 50px; top: -25px; right: 25px; }

        .hills {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 65%;
            z-index: 1;
        }
        
        .hill-back {
            position: absolute;
            bottom: 0;
            left: -15%;
            width: 130%;
            height: 100%;
            background: linear-gradient(180deg, #65a30d 0%, #4d7c0f 100%);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
        }

        .hill-front {
            position: absolute;
            bottom: -15%;
            left: 0;
            width: 100%;
            height: 75%;
            background: linear-gradient(180deg, #84cc16 0%, #65a30d 100%);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            box-shadow: inset 0 -20px 50px rgba(0,0,0,0.2), 0 -10px 30px rgba(0,0,0,0.1);
        }

        .ui-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .header-panel {
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .balance-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
            padding-bottom: 20px;
            min-height: 400px;
        }

        .balance-base {
            position: absolute;
            bottom: 0;
            width: 220px;
            height: 40px;
            background: linear-gradient(to bottom, #d4af37, #996515);
            border-radius: 30px 30px 10px 10px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.4), inset 0 5px 10px rgba(255,255,255,0.4), inset 0 -5px 10px rgba(0,0,0,0.5);
            border-bottom: 8px solid #5c3a07;
            z-index: 5;
        }

        .balance-pillar {
            position: absolute;
            bottom: 30px;
            width: 35px;
            height: 280px;
            background: linear-gradient(to right, #e2e8f0 0%, #94a3b8 50%, #475569 100%);
            border-radius: 17px;
            box-shadow: inset -5px 0 15px rgba(0,0,0,0.4), 10px 0 20px rgba(0,0,0,0.2);
            z-index: 4;
        }
        
        .pillar-cap {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 55px;
            height: 35px;
            background: linear-gradient(to bottom, #d4af37, #996515);
            border-radius: 50% 50% 10px 10px;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.5);
            z-index: 6;
        }

        .balance-beam-container {
            position: absolute;
            bottom: 290px;
            width: 90%;
            max-width: 550px;
            height: 24px;
            transform-origin: center center;
            z-index: 7;
        }

        .balance-beam {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #d4af37 0%, #b8860b 50%, #8b6508 100%);
            border-radius: 12px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3), inset 0 3px 5px rgba(255,255,255,0.6), inset 0 -3px 5px rgba(0,0,0,0.4);
            position: relative;
        }

        .balance-pivot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 45px;
            height: 45px;
            background: radial-gradient(circle, #f8fafc 0%, #94a3b8 100%);
            border-radius: 50%;
            border: 6px solid #b8860b;
            box-shadow: 0 5px 10px rgba(0,0,0,0.4), inset 0 2px 5px rgba(255,255,255,0.8);
            z-index: 8;
        }

        .pan-container {
            position: absolute;
            width: 160px;
            top: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: top center;
            z-index: 6;
        }

        .pan-right-container { right: 5px; } 
        .pan-left-container { left: 5px; }

        .pan-chains {
            position: relative;
            width: 120px;
            height: 110px;
        }
        
        .chain {
            position: absolute;
            top: 0;
            width: 3px;
            height: 115px;
            background: repeating-linear-gradient(to bottom, #94a3b8 0px, #94a3b8 4px, transparent 4px, transparent 6px);
        }
        .chain-left { left: 0; transform: rotate(-25deg); transform-origin: top; }
        .chain-right { right: 0; transform: rotate(25deg); transform-origin: top; }
        .chain-center { left: 50%; transform: translateX(-50%); }

        .pan {
            width: 160px;
            height: 45px;
            background: linear-gradient(to bottom, #e2e8f0 0%, #94a3b8 100%);
            border-radius: 5px 5px 70px 70px / 5px 5px 40px 40px;
            box-shadow: 0 15px 20px rgba(0,0,0,0.3), inset 0 5px 15px rgba(255,255,255,0.8), inset 0 -10px 20px rgba(0,0,0,0.4);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 8px;
            margin-top: -5px;
        }

        .weight-block {
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
            color: white;
            font-weight: 900;
            padding: 12px 18px;
            border-radius: 8px 8px 3px 3px;
            border-top: 3px solid #7dd3fc;
            border-bottom: 6px solid #1e3a8a;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.4);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            font-size: 1.3rem;
            opacity: 0;
            transform: translateY(-40px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 10;
        }
        
        .weight-block.active {
            opacity: 1;
            transform: translateY(0);
        }

        .unit-label {
            position: absolute;
            bottom: -35px;
            background: #1e293b;
            color: #facc15;
            padding: 4px 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            border: 2px solid #334155;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            white-space: nowrap;
        }

        .controls-panel {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            z-index: 20;
        }

        .task-panel {
            background: linear-gradient(90deg, #1e293b 0%, #0f172a 100%);
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            border-right: 6px solid #10b981;
            font-size: 1.4rem;
            font-weight: 900;
            color: #f8fafc;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
            line-height: 1.8;
        }

        .highlight-word {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 8px;
            margin: 0 5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border: 2px solid currentColor;
            background: rgba(15, 23, 42, 0.8);
        }
        
        .highlight-heavier { color: #f43f5e; text-shadow: 0 0 10px rgba(244,63,94,0.6); }
        .highlight-lighter { color: #10b981; text-shadow: 0 0 10px rgba(16,185,129,0.6); }
        .highlight-equal { color: #fbbf24; text-shadow: 0 0 10px rgba(251,191,36,0.6); }

        .selectors-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .selector-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(30, 41, 59, 0.8);
            padding: 15px;
            border-radius: 15px;
            border: 2px solid #334155;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .selector-group h3 {
            margin: 0 0 10px 0;
            color: #38bdf8;
            font-size: 1.1rem;
            font-weight: 800;
        }

        select {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            background-color: #ec4899; /* لون زهري */
            color: white;
            border: 2px solid #be185d; 
            font-family: inherit;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            text-align: center;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: left 15px top 50%;
            background-size: 15px auto;
            box-shadow: 0 4px 10px rgba(236, 72, 153, 0.3);
            transition: all 0.2s;
        }

        select:focus { 
            border-color: #fbcfe8; 
            box-shadow: 0 0 15px rgba(244, 114, 182, 0.7); 
        }
        
        select:disabled { 
            opacity: 0.9; 
            cursor: not-allowed; 
            background-color: #9d174d; /* لون زهري داكن للمحدد مسبقاً */
            border-color: #831843;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 5px;
        }

        .btn {
            border: none;
            padding: 15px 35px;
            border-radius: 12px;
            font-family: inherit;
            font-weight: 900;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            flex: 1;
            max-width: 350px;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: all 0.5s;
        }
        .btn:hover::after { left: 100%; }

        .btn-weigh {
            background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
            color: #fff;
            box-shadow: 0 8px 0 #b45309, 0 15px 20px rgba(0,0,0,0.3);
            border-bottom: 2px solid #92400e;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .btn-weigh:active { transform: translateY(8px); box-shadow: 0 0px 0 #b45309; }

        .btn-next {
            background: linear-gradient(180deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 8px 0 #047857, 0 15px 20px rgba(0,0,0,0.3);
            border-bottom: 2px solid #065f46;
            display: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .btn-next:active { transform: translateY(8px); box-shadow: 0 0px 0 #047857; }

        .message-box {
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-weight: 900;
            font-size: 1.2rem;
            opacity: 0;
            transition: all 0.3s;
            background: rgba(30, 41, 59, 0.9);
            color: #f8fafc;
            border: 2px solid #475569;
            transform: scale(0.95);
        }
        .message-box.show { opacity: 1; transform: scale(1); }
        .message-box.success { background: #065f46; color: #a7f3d0; border-color: #10b981; box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }
        .message-box.error { background: #7f1d1d; color: #fecaca; border-color: #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
        .message-box.info { border-left: 6px solid #3b82f6; }

        .avatar {
            position: absolute;
            bottom: 30%;
            left: 10%;
            width: 90px;
            height: 130px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150"><circle cx="50" cy="30" r="22" fill="%23fde047"/><rect x="35" y="55" width="30" height="65" fill="%23f1f5f9" rx="8"/><circle cx="50" cy="15" r="28" fill="%23fff" opacity="0.6"/></svg>') no-repeat center;
            background-size: contain;
            z-index: 5;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
        }

        @media (max-width: 768px) {
            .selectors-row { flex-direction: column; }
            .selectors-row > div { width: 100%; }
            .balance-beam-container { width: 95%; bottom: 250px; }
            .balance-pillar { height: 240px; }
            .pan-chains { height: 80px; }
            .chain { height: 85px; }
            .task-panel { font-size: 1.1rem; }
            .game-container { min-height: 850px; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <div class="scenery">
            <div class="sun"></div>
            <div class="clouds">
                <div class="cloud" style="transform: scale(0.8); margin-top: 10px;"></div>
                <div class="cloud" style="transform: scale(1.1); margin-top: 40px;"></div>
                <div class="cloud" style="transform: scale(0.7); margin-top: -10px;"></div>
            </div>
            <div class="hills">
                <div class="hill-back"></div>
                <div class="hill-front"></div>
            </div>
        </div>

        <div class="avatar"></div>

        <div class="ui-layer">
            
            <div class="header-panel glass-panel">
                <div class="flex items-center gap-4">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Emblem_of_Qatar.svg/200px-Emblem_of_Qatar.svg.png" alt="شعار دولة قطر" class="h-16 w-16 object-contain drop-shadow-md bg-white rounded-full p-1 border-2 border-slate-300">
                    <div>
                        <h2 class="text-xl font-bold text-pink-400 m-0 drop-shadow">مدرسة فاطمة بنت الخطاب</h2>
                        <h1 class="text-3xl font-black text-yellow-400 m-0 drop-shadow-lg">جزيرة القياس ⚖️</h1>
                        <p class="text-sm text-slate-200 mt-1 font-bold">المهمة: ميزان وحدات التخزين</p>
                    </div>
                </div>
                <div class="flex gap-3">
                    <span class="bg-blue-600 px-5 py-2 rounded-xl text-sm font-bold border-2 border-blue-400 shadow-lg text-white">🔊 الصوت: مفعل</span>
                </div>
            </div>

            <div class="balance-area">
                <div class="balance-pillar">
                    <div class="pillar-cap"></div>
                </div>
                <div class="balance-base"></div>
                
                <div class="balance-beam-container" id="beam-container">
                    <div class="balance-pivot"></div>
                    <div class="balance-beam"></div>
                    
                    <div class="pan-container pan-right-container" id="pan-right-container">
                        <div class="pan-chains">
                            <div class="chain chain-left"></div>
                            <div class="chain chain-center"></div>
                            <div class="chain chain-right"></div>
                        </div>
                        <div class="pan">
                            <div class="weight-block" id="weight-right">وحدة</div>
                            <div class="unit-label">الكفة 1 (اليمين)</div>
                        </div>
                    </div>

                    <div class="pan-container pan-left-container" id="pan-left-container">
                        <div class="pan-chains">
                            <div class="chain chain-left"></div>
                            <div class="chain chain-center"></div>
                            <div class="chain chain-right"></div>
                        </div>
                        <div class="pan">
                            <div class="weight-block" id="weight-left">وحدة</div>
                            <div class="unit-label">الكفة 2 (اليسار)</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="controls-panel glass-panel">
                <div class="task-panel" id="task-panel">
                    جاري تحميل المهمة... ⏳
                </div>

                <div class="selectors-row">
                    <div class="selector-group">
                        <h3>وحدة الكفة 1 (اليمين)</h3>
                        <select id="select-right">
                            <option value="none">-- اختر وحدة --</option>
                            <option value="1">Byte (بايت)</option>
                            <option value="2">Kilobyte (KB)</option>
                            <option value="3">Megabyte (MB)</option>
                            <option value="4">Gigabyte (GB)</option>
                            <option value="5">Terabyte (TB)</option>
                        </select>
                    </div>

                    <div class="text-3xl font-black text-slate-300 bg-slate-800 p-4 rounded-full border-4 border-slate-600 shadow-inner">VS</div>

                    <div class="selector-group">
                        <h3>وحدة الكفة 2 (اليسار - محددة)</h3>
                        <select id="select-left" disabled>
                            <option value="1">Byte (بايت)</option>
                            <option value="2">Kilobyte (KB)</option>
                            <option value="3">Megabyte (MB)</option>
                            <option value="4">Gigabyte (GB)</option>
                            <option value="5">Terabyte (TB)</option>
                        </select>
                    </div>
                </div>

                <div class="message-box show info" id="feedback-msg">
                    اقرأ المهمة واختر الوحدة المناسبة للكفة 1 (اليمين).
                </div>

                <div class="action-buttons">
                    <button class="btn btn-weigh" id="btn-weigh">⚖️ وزن الملفات وتحقق</button>
                    <button class="btn btn-next" id="btn-next">المهمة التالية ❯</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            const selectRight = document.getElementById('select-right');
            const selectLeft = document.getElementById('select-left');
            const btnWeigh = document.getElementById('btn-weigh');
            const btnNext = document.getElementById('btn-next');
            const taskPanel = document.getElementById('task-panel');
            const feedbackMsg = document.getElementById('feedback-msg');
            
            const weightRight = document.getElementById('weight-right');
            const weightLeft = document.getElementById('weight-left');
            
            const beamContainer = document.getElementById('beam-container');
            const panRightContainer = document.getElementById('pan-right-container');
            const panLeftContainer = document.getElementById('pan-left-container');

            const units = {
                "none": { text: "فارغ", weight: 0 },
                "1": { text: "1 Byte", weight: 1 },
                "2": { text: "1 KB", weight: 2 },
                "3": { text: "1 MB", weight: 3 },
                "4": { text: "1 GB", weight: 4 },
                "5": { text: "1 TB", weight: 5 }
            };

            const MAX_ANGLE = 16; 
            let currentTaskType = ''; 
            let isRoundActive = true;
            let audioStarted = false;

            async function startAudioEngine() {
                if (!audioStarted) {
                    await Tone.start();
                    audioStarted = true;
                }
            }

            function playScaleSound() {
                if (!audioStarted) return;
                const now = Tone.now();
                const metal = new Tone.MetalSynth({
                    frequency: 200,
                    envelope: { attack: 0.1, decay: 1.4, release: 0.2 },
                    harmonicity: 3.1,
                    modulationIndex: 16,
                    resonance: 2000,
                    octaves: 1
                }).toDestination();
                metal.volume.value = -20; 
                metal.triggerAttackRelease(1.5, now);
            }

            function playSuccessSound() {
                if (!audioStarted) return;
                const now = Tone.now();
                
                const synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.05, decay: 0.1, sustain: 0.4, release: 0.5 }
                }).toDestination();
                synth.triggerAttackRelease(["C4", "E4", "G4"], "8n", now);
                synth.triggerAttackRelease(["C5", "E5", "G5"], "4n", now + 0.2);

                const clapFilter = new Tone.Filter(1200, "bandpass").toDestination();
                const clapNoise = new Tone.Noise("pink");
                const clapEnv = new Tone.AmplitudeEnvelope({
                    attack: 0.005, decay: 0.1, sustain: 0, release: 0.05
                }).connect(clapFilter);
                
                clapNoise.connect(clapEnv);
                clapNoise.start(now);
                
                for (let i = 0; i < 35; i++) {
                    let timeOffset = (i * 0.06) + (Math.random() * 0.05);
                    clapEnv.triggerAttackRelease(0.04, now + timeOffset);
                }
                
                setTimeout(() => {
                    clapNoise.stop(); clapNoise.dispose(); synth.dispose(); clapFilter.dispose();
                }, 3000);
            }

            function playFailSound() {
                if (!audioStarted) return;
                const now = Tone.now();
                
                const synth = new Tone.FMSynth({
                    harmonicity: 0.5,
                    modulationIndex: 2,
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.1, decay: 0.2, sustain: 0.5, release: 1 }
                }).toDestination();
                synth.volume.value = -5;

                synth.triggerAttack("Eb4", now);
                synth.frequency.exponentialRampTo("C3", 1.5, now + 0.2);
                synth.triggerRelease(now + 1.5);
                
                setTimeout(() => synth.dispose(), 2000);
            }

            function showMessage(msg, type = 'info') {
                feedbackMsg.innerHTML = msg;
                feedbackMsg.className = 'message-box show';
                if (type === 'success') feedbackMsg.classList.add('success');
                else if (type === 'error') feedbackMsg.classList.add('error');
                else feedbackMsg.classList.add('info');
            }

            function updateVisualWeights(valR, valL) {
                if (valR !== "none") {
                    weightRight.textContent = units[valR].text;
                    weightRight.classList.add('active');
                } else {
                    weightRight.classList.remove('active');
                }

                if (valL !== "none") {
                    weightLeft.textContent = units[valL].text;
                    weightLeft.classList.add('active');
                } else {
                    weightLeft.classList.remove('active');
                }
            }

            function animateBalance(angle, playSound = true) {
                if (playSound && angle !== 0) playScaleSound();

                gsap.to(beamContainer, {
                    rotation: angle,
                    duration: 1.5,
                    ease: "elastic.out(1, 0.4)" 
                });

                gsap.to([panRightContainer, panLeftContainer], {
                    rotation: -angle,
                    duration: 1.5,
                    ease: "elastic.out(1, 0.4)"
                });
            }

            function startNewRound() {
                isRoundActive = true;
                btnWeigh.style.display = 'block';
                btnNext.style.display = 'none';
                
                selectRight.value = "none";
                showMessage("اقرأ المهمة واختر الوحدة المناسبة للكفة 1 (اليمين).", "info");
                animateBalance(0, false); 

                const taskTypes = ['heavier', 'lighter', 'equal'];
                currentTaskType = taskTypes[Math.floor(Math.random() * taskTypes.length)];
                
                let possibleLeftValues = [];
                
                if (currentTaskType === 'heavier') {
                    taskPanel.innerHTML = 'المهمة: اجعل الكفة 1 (اليمين) <span class="highlight-word highlight-heavier">أثقل (أكبر سعة)</span> من الكفة 2.';
                    possibleLeftValues = [1, 2, 3, 4]; 
                } else if (currentTaskType === 'lighter') {
                    taskPanel.innerHTML = 'المهمة: اجعل الكفة 1 (اليمين) <span class="highlight-word highlight-lighter">أخف (أقل سعة)</span> من الكفة 2.';
                    possibleLeftValues = [2, 3, 4, 5]; 
                } else {
                    taskPanel.innerHTML = 'المهمة: اجعل الكفة 1 (اليمين) <span class="highlight-word highlight-equal">تساوي</span> الكفة 2 في السعة.';
                    possibleLeftValues = [1, 2, 3, 4, 5];
                }

                const randomLeft = possibleLeftValues[Math.floor(Math.random() * possibleLeftValues.length)];
                selectLeft.value = randomLeft.toString();
                
                updateVisualWeights("none", selectLeft.value);
            }

            btnWeigh.addEventListener('click', async () => {
                await startAudioEngine();

                if (!isRoundActive) return;

                const valR = selectRight.value;
                const valL = selectLeft.value;

                updateVisualWeights(valR, valL);

                if (valR === "none") {
                    showMessage("⚠️ الرجاء اختيار وحدة للكفة 1 (اليمين) أولاً!", "error");
                    return;
                }

                const weightR = units[valR].weight;
                const weightL = units[valL].weight;

                let tiltAngle = 0;
                let isAnswerCorrect = false;

                if (weightR > weightL) tiltAngle = MAX_ANGLE; 
                else if (weightL > weightR) tiltAngle = -MAX_ANGLE;
                else tiltAngle = 0;

                if (currentTaskType === 'heavier' && weightR > weightL) isAnswerCorrect = true;
                if (currentTaskType === 'lighter' && weightR < weightL) isAnswerCorrect = true;
                if (currentTaskType === 'equal' && weightR === weightL) isAnswerCorrect = true;

                animateBalance(tiltAngle, true); 

                setTimeout(() => {
                    if (isAnswerCorrect) {
                        playSuccessSound();
                        showMessage("👏 رائع! إجابة صحيحة والمهمة تمت بنجاح.", "success");
                        isRoundActive = false;
                        btnWeigh.style.display = 'none';
                        btnNext.style.display = 'block';
                    } else {
                        playFailSound();
                        showMessage("أووه! إجابة خاطئة.. لاحظ حركة الميزان للوزن الحقيقي. حاول مجدداً.", "error");
                    }
                }, 800);
            });

            btnNext.addEventListener('click', () => {
                startNewRound();
            });

            startNewRound();
        });
    </script>
</body>
</html>
